<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/general.css" />
    <link rel="stylesheet" href="./styles/videoteca.css" />
    <title>Grupo orientar</title>
  </head>
  <body>
    <div class="content">
      <img
        src="./imagenes/videoteca/29-Fondo Estructura Web Videoteca.png"
        alt="Fondo"
        class="full"
      />
      <img
        src="./imagenes/videoteca/31-Banda Horizontal Superior Estructura Web Videoteca.png"
        alt="Barra Superior"
        class="full"
      />
      <img
        src="./imagenes/videoteca/30-Fondo Blanco Estructura Web Videoteca.png"
        alt="Barra Lateral"
        class="full"
      />
      <img
        src="./imagenes/videoteca/32-Banda Horizontal Inferior Estructura Web Videoteca.png"
        alt="Barra Inferior"
        class="full"
      />
      <img
        src="./imagenes/videoteca/37-Logo pequeño Estructura Web Videoteca.png"
        alt="Logo Chico"
        class="full"
      />
      <img
        src="./imagenes/videoteca/33-Titulo VIDEOTECA Estructura Web Videoteca.png"
        alt="Videoteca"
        class="full"
      />
      <img
        src="./imagenes/videoteca/34-Seleccione (texto) Estructura Web Videoteca.png"
        alt="Texto Videoteca"
        class="full"
      />
      <img
        src="./imagenes/videoteca/35-Fondo transparente Estructura Web Videoteca.png"
        alt="Videoteca"
        class="full"
      />
      <img
        src="./imagenes/videoteca/36-Marco Fondo Transparente Estructura Web Videoteca.png"
        alt="Videoteca"
        class="full"
      />
      <img
        src="./imagenes/videoteca/(Videoteca) Pantalla Reproductora.png"
        alt="Videoteca"
        class="full"
      />
      <img
        src="./imagenes/videoteca/(Videoteca) base gris destaque botones.png"
        alt="Videoteca"
        class="full"
      />

      <img
        src="./imagenes/videoteca/(Videoteca) pausa.png"
        class="boton-pausa"
        onclick="pauseVideo()"
      />
      <img
        src="./imagenes/videoteca/(Videoteca) play.png"
        class="boton-play"
        onclick="playVideo()"
      />
      <img
        src="./imagenes/videoteca/(Videoteca) reproducir desde el principio.png"
        class="boton-repetir"
        onclick="restartVideo()"
      />
      <img
        src="./imagenes/videoteca/(Videoteca) stop.png"
        class="boton-stop"
        onclick="stopVideo()"
      />
      <img
        src="./imagenes/videoteca/(Videoteca) video anterior.png"
        class="boton-anterior"
        onclick="anteriorVideo()"
      />
      <img
        src="./imagenes/videoteca/(Videoteca) video siguiente.png"
        class="boton-siguiente"
        onclick="siguienteVideo()"
      />

      <div class="main-display">
        <video id="videoplayer" width="100%" height="100%" controls>
          <source id="video-source" src="" type="video/mp4" />
        </video>
      </div>

      <div class="titulo-miniatura-boton-column">
        <div id="videos-relacionados"></div>
      </div>

      <div class="titulos-column" id="titulos-column"></div>
    </div>

    <script src="./scripts/videoteca.js"></script>
  </body>
</html>
