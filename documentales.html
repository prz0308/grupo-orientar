<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/general.css" />
    <link rel="stylesheet" href="./styles/documentales.css" />
    <title>Grupo orientar</title>
  </head>
  <body>
    <div class="content">
      <img
        src="./imagenes/documentales/57-Foto Base Fondo Web Documentales.png"
        alt="Fondo"
        class="full"
      />
      <img
        src="./imagenes/documentales/59-Banda Horizontal Superior Web Documentales.png"
        alt="Barra Superior"
        class="full"
      />
      <img
        src="./imagenes/documentales/62-Banda fondo lateral Transparente Web Documentales.png"
        alt="Barra Lateral"
        class="full"
      />
      <img
        src="./imagenes/documentales/58-Banda Horizontal Inferior Web Documentales.png"
        alt="Barra Inferior"
        class="full"
      />
      <img
        src="./imagenes/documentales/61-Logo chico arriba izquierda Web Documentales.png"
        alt="Logo Chico"
        class="full"
      />
      <img
        src="./imagenes/documentales/60-Texto Inferior (Plataforma..) Web Documentales.png"
        alt="Texto Documentales"
        class="full"
      />
      <img
        src="./imagenes/documentales/65-Marco Pantalla Reproducción 16-9 Web Documentales.png"
        alt="Documentales"
        class="full"
      />
      <img
        src="./imagenes/documentales/78-Botonera base gris destaque.png"
        alt="Documentales"
        class="full"
      />

      <img
        src="./imagenes/documentales/72-Botonera stop documental.png"
        alt="Documentales"
        class="boton-stop"
        onclick="stopVideo()"
      />
      <img
        src="./imagenes/documentales/73-Botonera documental anterior.png"
        alt="Documentales"
        class="boton-anterior"
        onclick="anteriorVideo()"
      />
      <img
        src="./imagenes/documentales/74-Botonera pausa.png"
        alt="Documentales"
        class="boton-pausa"
        onclick="pauseVideo()"
      />
      <img
        src="./imagenes/documentales/75-Botonera play.png"
        alt="Documentales"
        class="boton-play"
        onclick="playVideo()"
      />
      <img
        src="./imagenes/documentales/76-Botonera repetir documental.png"
        alt="Documentales"
        class="boton-repetir"
        onclick="restartVideo()"
      />
      <img
        src="./imagenes/documentales/77-Botonera documental siguiente.png"
        alt="Documentales"
        class="boton-siguiente"
        onclick="siguienteVideo()"
      />

      <div class="main-display">
        <video id="player" width="100%" height="100%" controls>
          <source
            src="./videos/documentales/293788_small.mp4"
            type="video/mp4"
          />
          Tu navegador no soporta la reproducción de video.
        </video>
      </div>

      <div class="videos-column"></div>
    </div>

    <script src="./scripts/documentales.js"></script>
  </body>
</html>
